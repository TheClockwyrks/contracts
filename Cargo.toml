# The workspace of the contracts repository. Every crate under crates/ is a
# member; add a crate by adding its directory.
[workspace]
# The resolver of edition 2024, the monorepo's, so a crate resolves the same
# features and the same MSRV-aware versions on both sides of an extraction.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/TheClockwyrks/contracts"
# A crate of The Test Cabinet is consumed by its git source, never from
# crates.io, so none is published; a member says `publish.workspace = true`, and
# Cargo refuses that key when the root holds none to inherit.
publish = false

# Warnings-as-errors, baked into the manifests for every member crate that
# opts in with `[lints] workspace = true`, so a plain `cargo build` enforces
# the policy the clippy gate enforces on the command line.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

# The crates of the other repositories this one may depend on, each at its
# public source, the GitHub mirror, and the tag its dependents pin. The
# superrepo's .cargo/config.toml redirects every one of these to the sibling
# checkout, so a build inside the superrepo never fetches them. A manifest
# never names an Azure URL or a path outside the repository: the
# dependency-edges gate refuses both.
[workspace.dependencies]
# contracts depends on no crate of another repository.

# The third-party crates the members share, at the requirements the monorepo
# held them to when the crates were extracted from it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
cuid2 = "0.1"
toml = "0.8"
toml_edit = { version = "0.25", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
handlebars = "6"
tempfile = "3"
schemars = "1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
which = "8"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
# The backend client's transport. TLS through rustls so no system OpenSSL is
# needed; `json` for the request and answer bodies.
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
] }
async-trait = "0.1"
# The backend client's tests run on it; nothing in this repository spawns a
# runtime of its own.
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync"] }

# The OpenTelemetry crates the telemetry crate is built on. They move in
# lockstep across the `opentelemetry` ecosystem and are pinned together, as the
# monorepo pins them, so every service shares one mutually-compatible set;
# bumping one means bumping all. Transport is OTLP over HTTP/protobuf through
# `reqwest`'s blocking client, so no `protoc` is needed. `http` is named so the
# propagation helpers speak `http::HeaderMap`.
http = "1"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
	"http-proto",
	"reqwest-blocking-client",
	"trace",
	"metrics",
	"logs",
] }
opentelemetry-http = { version = "0.32", default-features = false }
# `semconv_experimental` exposes the stabilized-but-feature-gated keys the
# resource uses, notably `deployment.environment.name`.
opentelemetry-semantic-conventions = { version = "0.32", features = [
	"semconv_experimental",
] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The SHA-256 digests the contracts and suites crates take (of a record, of a
# suite's content) would otherwise run unoptimised in a test build. Optimising the hash changes no output, only how long the
# digest takes, and matches the profile the monorepo builds these crates with.
[profile.dev.package.sha2]
opt-level = 3
